name: social-engagement
services:
- name: api
  github:
    branch: main
    deploy_on_push: true
  source_dir: backend
  dockerfile_path: Dockerfile
  http_port: 3001
  routes:
  - path: /api
  env:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3001"
  - key: MONGODB_URI
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: ${MONGODB_URI}
  - key: JWT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: ${JWT_SECRET}
  health_check:
    http_path: /health
  instance_count: 1
  instance_size_slug: basic-xs
  cors:
    allow_origins:
      - regex: .*