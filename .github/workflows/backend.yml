name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint || true
      
      - name: Run tests
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/social-engagement-test
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
  
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/social-engagement-backend:${{ github.sha }},${{ secrets.DOCKER_HUB_USERNAME }}/social-engagement-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/social-engagement-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/social-engagement-backend:buildcache,mode=max
      
      - name: Save Docker image tag to artifact
        run: echo "${{ github.sha }}" > docker-image-tag.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image-tag
          path: docker-image-tag.txt
  
  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.socialengagement.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download Docker image tag
        uses: actions/download-artifact@v3
        with:
          name: docker-image-tag
      
      - name: Set Docker image tag
        run: |
          export DOCKER_IMAGE_TAG=$(cat docker-image-tag.txt)
          echo "DOCKER_IMAGE_TAG=$DOCKER_IMAGE_TAG" >> $GITHUB_ENV
      
      - name: Deploy to staging server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USERNAME }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script: |
            cd /opt/social-engagement
            echo "IMAGE_TAG=${{ env.DOCKER_IMAGE_TAG }}" > .env.deploy
            echo "ENVIRONMENT=staging" >> .env.deploy
            docker-compose pull
            docker-compose up -d --force-recreate backend
            sleep 10
            docker-compose ps -a | grep backend
            docker image prune -f
  
  deploy-production:
    name: Deploy to Production
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.socialengagement.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download Docker image tag
        uses: actions/download-artifact@v3
        with:
          name: docker-image-tag
      
      - name: Set Docker image tag
        run: |
          export DOCKER_IMAGE_TAG=$(cat docker-image-tag.txt)
          echo "DOCKER_IMAGE_TAG=$DOCKER_IMAGE_TAG" >> $GITHUB_ENV
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT }}
          script: |
            cd /opt/social-engagement
            echo "IMAGE_TAG=${{ env.DOCKER_IMAGE_TAG }}" > .env.deploy
            echo "ENVIRONMENT=production" >> .env.deploy
            docker-compose pull
            docker-compose up -d --force-recreate backend
            sleep 10
            docker-compose ps -a | grep backend
            docker image prune -f